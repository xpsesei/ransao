<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端影院 - 免费高清影视站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between" x-data="videoApp()">

    <!-- 顶部导航栏 -->
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-2xl font-black bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">🎬 云端影院</a>
            </div>
            <!-- 全局搜索框（绑定 @focus 触发按需加载搜索索引，绝不抢占首屏带宽） -->
            <div class="w-64 md:w-96 relative">
                <input type="text" 
                       x-model="searchKeyword" 
                       @focus="initSearchIndex()" 
                       @input="onGlobalSearch()" 
                       placeholder="全网全局搜索（片名、演员）..." 
                       class="w-full bg-slate-800 border border-slate-700 rounded-full px-4 py-1.5 text-sm focus:outline-none focus:border-blue-500 text-slate-100">
            </div>
        </div>
    </header>

    <!-- 主体内容区 -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        
        <!-- 分类与首页导航栏 -->
        <div class="flex items-center space-x-2 overflow-x-auto pb-4 mb-6 scrollbar-none">
            <button @click="switchCategoryByName('🔥 最新更新')" 
                    :class="!isSearching && currentCategory === '🔥 最新更新' ? 'bg-blue-600 text-white font-bold shadow-lg shadow-blue-600/30' : 'bg-slate-900 text-slate-400 hover:bg-slate-800'"
                    class="px-4 py-2 rounded-xl text-sm whitespace-nowrap transition flex items-center space-x-1">
                <span>🔥 最新更新</span>
            </button>

            <template x-for="cat in categories" :key="cat.name">
                <template x-if="cat.name !== '🔥 最新更新'">
                    <button @click="switchCategory(cat)" 
                            :class="!isSearching && currentCategory === cat.name ? 'bg-blue-600 text-white font-bold shadow-lg shadow-blue-600/30' : 'bg-slate-900 text-slate-400 hover:bg-slate-800'"
                            class="px-4 py-2 rounded-xl text-sm whitespace-nowrap transition"
                            x-text="cat.name + (cat.count ? ' (' + cat.count + ')' : '')">
                    </button>
                </template>
            </template>
        </div>

        <!-- 搜索状态提示 -->
        <div x-show="isSearching" class="mb-4 text-sm text-blue-400 flex items-center justify-between">
            <span>🔍 全局搜索结果：“<span x-text="searchKeyword"></span>”，共找到 <span x-text="filteredVideos.length"></span> 部相关影视</span>
            <button @click="clearSearch()" class="text-xs bg-slate-800 px-3 py-1 rounded-lg text-slate-300 hover:bg-slate-700">退出搜索</button>
        </div>
        <center>
            <script async type="application/javascript" src="https://a.magsrv.com/ad-provider.js"></script> 
            <ins class="eas6a97888e20" data-zoneid="6080530"></ins> 
            <script>(AdProvider = window.AdProvider || []).push({"serve": {}});</script>
        </center>

        <!-- 视频网格列表 -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <template x-for="vod in paginatedVideos" :key="vod.id">
                <div @click="goToPlay(vod)" class="bg-slate-900 rounded-xl overflow-hidden border border-slate-800 hover:border-blue-500/50 transition cursor-pointer group flex flex-col">
                    <div class="relative aspect-[3/4] bg-slate-800 overflow-hidden">
                        <img :src="vod.pic" @error="$el.src='https://via.placeholder.com/300x400?text=No+Image'" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                        <div class="absolute bottom-2 right-2 bg-black/70 backdrop-blur px-2 py-0.5 rounded text-xs text-yellow-400 font-semibold" x-text="vod.year || '最新'"></div>
                    </div>
                    <div class="p-3 flex flex-col justify-between flex-grow">
                        <h3 class="font-bold text-sm truncate text-slate-200 group-hover:text-blue-400 transition" x-text="vod.title"></h3>
                        <p class="text-xs text-slate-500 truncate mt-1" x-text="vod.actor || vod.category"></p>
                    </div>
                </div>
            </template>
        </div>

        <!-- 无数据或加载中提示 -->
        <div x-show="filteredVideos.length === 0" class="text-center py-20 text-slate-500">
            正在从云端飞速加载中...
        </div>

        <!-- 📄 分页控制条（严格每页 28 个视频） -->
        <div x-show="totalPages > 1" class="flex justify-center items-center space-x-3 mt-8">
            <button @click="changePage(currentPage - 1)" :disabled="currentPage === 1"
                    class="px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm text-slate-300 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-800 transition">
                上一页
            </button>
            <span class="text-sm text-slate-400">
                第 <span class="text-blue-400 font-bold" x-text="currentPage"></span> / <span x-text="totalPages"></span> 页
            </span>
            <button @click="changePage(currentPage + 1)" :disabled="currentPage >= totalPages"
                    class="px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm text-slate-300 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-800 transition">
                下一页
            </button>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>Copyright &copy; 云端影院 All Rights Reserved. 资源来自第三方采集接口，仅供学习交流使用。</p>
    </footer>

    <script>
        function videoApp() {
            return {
                categories: [],
                allVideos: [],
                searchIndex: [],
                filteredVideos: [],
                currentCategory: '🔥 最新更新',
                searchKeyword: '',
                isSearching: false,
                isSearchIndexLoaded: false,
                
                currentPage: 1,
                pageSize: 28, // 🎯 严格设置为每页 28 个视频

                init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const paramCat = urlParams.get('cat');
                    const paramPage = parseInt(urlParams.get('p')) || 1;
                    const paramQ = urlParams.get('q');

                    if (paramPage > 1) this.currentPage = paramPage;
                    if (paramQ) {
                        this.searchKeyword = paramQ;
                        this.isSearching = true;
                    }

                    // 1. 仅加载轻量分类索引（首屏极速响应）
                    fetch('./data/categories.json')
                        .then(res => res.json())
                        .then(data => { 
                            this.categories = data || [];
                            
                            let targetCat = this.categories[0];
                            if (paramCat) {
                                const found = this.categories.find(c => c.name === paramCat);
                                if (found) targetCat = found;
                            } else {
                                const latest = this.categories.find(c => c.name.includes('最新'));
                                if (latest) targetCat = latest;
                            }

                            if (targetCat) {
                                this.switchCategory(targetCat, false);
                            }

                            // 如果带有搜索参数，则立刻加载搜索索引并执行搜索
                            if (paramQ) {
                                this.initSearchIndex(() => {
                                    this.onGlobalSearch(false);
                                });
                            }

                            // 🚀 核心改动：采用延迟且温和的后台异步预加载，绝对不抢占首屏带宽
                            setTimeout(() => {
                                this.lazyPrefetchCategories();
                            }, 1500);
                        })
                        .catch(err => console.log('Waiting for categories sync...'));
                },

                // 🚀 按需懒加载搜索索引（只有点击搜索框时才触发，首屏零负担）
                initSearchIndex(callback) {
                    if (this.isSearchIndexLoaded) {
                        if (callback) callback();
                        return;
                    }
                    fetch('./data/search_index.json')
                        .then(res => res.json())
                        .then(data => {
                            this.searchIndex = data || [];
                            this.isSearchIndexLoaded = true;
                            if (callback) callback();
                        })
                        .catch(err => console.log('Search index load failed'));
                },

                // 🚀 延迟且低频的后台预加载（避免瞬间并发打满带宽）
                lazyPrefetchCategories() {
                    if (!this.categories || this.categories.length === 0) return;
                    
                    // 挑选前 5 个最常用的分类在后台默默缓存
                    let index = 0;
                    const prefetchNext = () => {
                        if (index >= Math.min(this.categories.length, 5)) return;
                        const cat = this.categories[index++];
                        let filesToFetch = cat.file ? [cat.file] : (cat.files || []);
                        if (filesToFetch.length > 0) {
                            const cacheKey = `vod_cache_${cat.name}`;
                            if (!sessionStorage.getItem(cacheKey)) {
                                Promise.all(filesToFetch.map(f => 
                                    fetch('./data/' + f).then(res => res.json()).catch(err => [])
                                ))
                                .then(results => {
                                    const merged = results.flat();
                                    try {
                                        sessionStorage.setItem(cacheKey, JSON.stringify(merged));
                                    } catch (e) {}
                                    // 错开时间请求下一个，保护网络
                                    setTimeout(prefetchNext, 800);
                                }).catch(err => {
                                    setTimeout(prefetchNext, 800);
                                });
                            } else {
                                prefetchNext();
                            }
                        } else {
                            prefetchNext();
                        }
                    };
                    prefetchNext();
                },

                updateUrl() {
                    const params = new URLSearchParams();
                    if (this.currentCategory && this.currentCategory !== '🔥 最新更新') {
                        params.set('cat', this.currentCategory);
                    }
                    if (this.currentPage > 1) {
                        params.set('p', this.currentPage);
                    }
                    if (this.isSearching && this.searchKeyword.trim()) {
                        params.set('q', this.searchKeyword.trim());
                    }
                    const newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
                    history.replaceState(null, '', newUrl);
                },

                switchCategoryByName(name) {
                    const cat = this.categories.find(c => c.name === name);
                    if (cat) {
                        this.switchCategory(cat);
                    }
                },

                switchCategory(cat, resetPage = true) {
                    if (!cat) return;
                    this.isSearching = false;
                    this.searchKeyword = '';
                    this.currentCategory = cat.name;
                    if (resetPage) {
                        this.currentPage = 1;
                    }
                    this.allVideos = [];
                    this.filteredVideos = [];
                    
                    this.updateUrl();

                    // 🚀 核心优化：优先从浏览器本地内存（SessionStorage）中读取缓存数据
                    const cacheKey = `vod_cache_${cat.name}`;
                    const cachedData = sessionStorage.getItem(cacheKey);
                    if (cachedData) {
                        try {
                            this.allVideos = JSON.parse(cachedData);
                            this.filterVideos();
                            return; // 命中内存缓存，实现 0 毫秒极速切换！
                        } catch (e) {}
                    }

                    let filesToFetch = [];
                    if (cat.file) {
                        filesToFetch = [cat.file];
                    } else if (cat.files && Array.isArray(cat.files)) {
                        filesToFetch = cat.files;
                    }

                    if (filesToFetch.length === 0) return;

                    // 若未命中缓存，则请求分片文件
                    Promise.all(filesToFetch.map(f => 
                        fetch('./data/' + f)
                            .then(res => res.json())
                            .catch(err => [])
                    ))
                    .then(results => {
                        const merged = results.flat();
                        this.allVideos = merged;
                        this.filterVideos();

                        // 写入内存缓存，以便下次点击秒开
                        try {
                            sessionStorage.setItem(cacheKey, JSON.stringify(merged));
                        } catch (e) {}
                    })
                    .catch(err => { 
                        this.allVideos = []; 
                        this.filteredVideos = []; 
                    });
                },

                onGlobalSearch(updateHistory = true) {
                    if (!this.searchKeyword.trim()) {
                        this.clearSearch();
                        return;
                    }

                    this.isSearching = true;
                    if (updateHistory) {
                        this.currentPage = 1;
                    }
                    const kw = this.searchKeyword.toLowerCase();

                    // 如果还没加载索引，先触发加载
                    if (!this.isSearchIndexLoaded) {
                        this.initSearchIndex(() => {
                            this.performSearch(kw, updateHistory);
                        });
                    } else {
                        this.performSearch(kw, updateHistory);
                    }
                },

                performSearch(kw, updateHistory) {
                    if (this.searchIndex.length > 0) {
                        this.filteredVideos = this.searchIndex.filter(v => 
                            (v.title && v.title.toLowerCase().includes(kw)) || 
                            (v.actor && v.actor.toLowerCase().includes(kw))
                        );
                    } else {
                        this.filteredVideos = this.allVideos.filter(v => 
                            (v.title && v.title.toLowerCase().includes(kw)) || 
                            (v.actor && v.actor.toLowerCase().includes(kw))
                        );
                    }

                    if (updateHistory) {
                        this.updateUrl();
                    }
                },

                clearSearch() {
                    this.searchKeyword = '';
                    this.isSearching = false;
                    const latestCat = this.categories.find(c => c.name.includes('最新')) || this.categories[0];
                    if (latestCat) {
                        this.switchCategory(latestCat);
                    }
                },

                filterVideos() {
                    this.filteredVideos = this.allVideos;
                },

                get paginatedVideos() {
                    const start = (this.currentPage - 1) * this.pageSize;
                    const end = start + this.pageSize;
                    return this.filteredVideos.slice(start, end);
                },

                get totalPages() {
                    return Math.ceil(this.filteredVideos.length / this.pageSize) || 1;
                },

                changePage(page) {
                    if (page >= 1 && page <= this.totalPages) {
                        this.currentPage = page;
                        this.updateUrl();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                },

                goToPlay(vodSummary) {
                    window.location.href = `play.html?id=${vodSummary.id}&cat=${encodeURIComponent(vodSummary.category)}`;
                }
            }
        }
    </script>

</body>
</html>
