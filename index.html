<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端影院 - 免费高清影视站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between" x-data="videoApp()">

    <!-- 顶部导航栏 -->
    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-2xl font-black bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">🎬 云端影院</a>
            </div>
            <!-- 全局搜索框 -->
            <div class="w-64 md:w-96 relative">
                <input type="text" x-model="searchKeyword" @input="onGlobalSearch()" placeholder="全网全局搜索（片名、演员）..." class="w-full bg-slate-800 border border-slate-700 rounded-full px-4 py-1.5 text-sm focus:outline-none focus:border-blue-500 text-slate-100">
            </div>
        </div>
    </header>

    <!-- 主体内容区 -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        
        <!-- 分类与首页导航栏 -->
        <div class="flex items-center space-x-2 overflow-x-auto pb-4 mb-6 scrollbar-none">
            <!-- 固定的首页/最新按钮 -->
            <button @click="goHome()" 
                    :class="!isSearching && (currentCategory === '🔥 最新更新' || currentCategory === '') ? 'bg-blue-600 text-white font-bold shadow-lg shadow-blue-600/30' : 'bg-slate-900 text-slate-400 hover:bg-slate-800'"
                    class="px-4 py-2 rounded-xl text-sm whitespace-nowrap transition flex items-center space-x-1">
                <span>🏠 首页</span>
            </button>

            <!-- 动态分类按钮 -->
            <template x-for="cat in categories" :key="cat.name">
                <button @click="switchCategory(cat)" 
                        :class="!isSearching && currentCategory === cat.name ? 'bg-blue-600 text-white font-bold shadow-lg shadow-blue-600/30' : 'bg-slate-900 text-slate-400 hover:bg-slate-800'"
                        class="px-4 py-2 rounded-xl text-sm whitespace-nowrap transition"
                        x-text="cat.name + (cat.count ? ' (' + cat.count + ')' : '')">
                </button>
            </template>
        </div>

        <!-- 搜索状态提示 -->
        <div x-show="isSearching" class="mb-4 text-sm text-blue-400 flex items-center justify-between">
            <span>🔍 全局搜索结果：“<span x-text="searchKeyword"></span>”，共找到 <span x-text="filteredVideos.length"></span> 部相关影视</span>
            <button @click="clearSearch()" class="text-xs bg-slate-800 px-3 py-1 rounded-lg text-slate-300 hover:bg-slate-700">退出搜索</button>
        </div>

        <!-- 视频网格列表 -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <template x-for="vod in paginatedVideos" :key="vod.id">
                <div @click="goToPlay(vod)" class="bg-slate-900 rounded-xl overflow-hidden border border-slate-800 hover:border-blue-500/50 transition cursor-pointer group flex flex-col">
                    <div class="relative aspect-[3/4] bg-slate-800 overflow-hidden">
                        <img :src="vod.pic" @error="$el.src='https://via.placeholder.com/300x400?text=No+Image'" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                        <div class="absolute bottom-2 right-2 bg-black/70 backdrop-blur px-2 py-0.5 rounded text-xs text-yellow-400 font-semibold" x-text="vod.year || '最新'"></div>
                    </div>
                    <div class="p-3 flex flex-col justify-between flex-grow">
                        <h3 class="font-bold text-sm truncate text-slate-200 group-hover:text-blue-400 transition" x-text="vod.title"></h3>
                        <p class="text-xs text-slate-500 truncate mt-1" x-text="vod.actor || vod.category"></p>
                    </div>
                </div>
            </template>
        </div>

        <!-- 无数据或加载提示 -->
        <div x-show="filteredVideos.length === 0" class="text-center py-20 text-slate-500">
            正在从云端加载影视资源，如果长时间未显示请检查数据同步是否完成...
        </div>

        <!-- 📄 分页控制条 -->
        <div x-show="totalPages > 1" class="flex justify-center items-center space-x-3 mt-8">
            <button @click="changePage(currentPage - 1)" :disabled="currentPage === 1"
                    class="px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm text-slate-300 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-800 transition">
                上一页
            </button>
            <span class="text-sm text-slate-400">
                第 <span class="text-blue-400 font-bold" x-text="currentPage"></span> / <span x-text="totalPages"></span> 页
            </span>
            <button @click="changePage(currentPage + 1)" :disabled="currentPage >= totalPages"
                    class="px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm text-slate-300 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-800 transition">
                下一页
            </button>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>Copyright &copy; 云端影院 All Rights Reserved. 资源来自第三方采集接口，仅供学习交流使用。</p>
    </footer>

    <script>
        function videoApp() {
            return {
                categories: [],
                allVideos: [],
                searchIndex: [],
                filteredVideos: [],
                currentCategory: '',
                searchKeyword: '',
                isSearching: false,
                
                currentPage: 1,
                pageSize: 30,

                init() {
                    const targetCat = localStorage.getItem('targetCategory');
                    const targetSearch = localStorage.getItem('targetSearch');

                    // 1. 加载分类索引
                    fetch('./data/categories.json')
                        .then(res => res.json())
                        .then(data => { 
                            this.categories = data;
                            if (targetCat) {
                                localStorage.removeItem('targetCategory');
                                const found = data.find(c => c.name === targetCat);
                                if (found) {
                                    this.switchCategory(found);
                                    return;
                                }
                            }
                            
                            // 默认加载第一个分类（即最新的内容）
                            if (data && data.length > 0) {
                                const latestCat = data.find(c => c.name.includes('最新')) || data[0];
                                this.switchCategory(latestCat);
                            }

                            if (targetSearch) {
                                localStorage.removeItem('targetSearch');
                                this.searchKeyword = targetSearch;
                                setTimeout(() => { this.onGlobalSearch(); }, 300);
                            }
                        })
                        .catch(err => {
                            console.log('Waiting for categories sync...');
                        });

                    // 2. 异步加载全局搜索索引
                    fetch('./data/search_index.json')
                        .then(res => res.json())
                        .then(data => {
                            this.searchIndex = data;
                            if (targetSearch) {
                                this.onGlobalSearch();
                            }
                        })
                        .catch(err => console.log('Waiting for search index sync...'));
                },

                goHome() {
                    const latestCat = this.categories.find(c => c.name.includes('最新')) || this.categories[0];
                    if (latestCat) {
                        this.switchCategory(latestCat);
                    }
                },

                switchCategory(cat) {
                    this.isSearching = false;
                    this.searchKeyword = '';
                    this.currentCategory = cat.name;
                    this.currentPage = 1;
                    this.allVideos = [];
                    this.filteredVideos = [];
                    
                    if (cat.file) {
                        fetch('./data/' + cat.file)
                            .then(res => res.json())
                            .then(data => {
                                this.allVideos = data;
                                this.filterVideos();
                            })
                            .catch(err => { this.allVideos = []; this.filteredVideos = []; });
                    } else if (cat.files && Array.isArray(cat.files)) {
                        Promise.all(cat.files.map(f => fetch('./data/' + f).then(res => res.json())))
                            .then(results => {
                                this.allVideos = results.flat();
                                this.filterVideos();
                            })
                            .catch(err => { this.allVideos = []; this.filteredVideos = []; });
                    }
                },

                onGlobalSearch() {
                    if (!this.searchKeyword.trim()) {
                        this.clearSearch();
                        return;
                    }

                    this.isSearching = true;
                    this.currentPage = 1;
                    const kw = this.searchKeyword.toLowerCase();

                    if (this.searchIndex.length > 0) {
                        this.filteredVideos = this.searchIndex.filter(v => 
                            (v.title && v.title.toLowerCase().includes(kw)) || 
                            (v.actor && v.actor.toLowerCase().includes(kw))
                        );
                    } else {
                        this.filteredVideos = this.allVideos.filter(v => 
                            (v.title && v.title.toLowerCase().includes(kw)) || 
                            (v.actor && v.actor.toLowerCase().includes(kw))
                        );
                    }
                },

                clearSearch() {
                    this.searchKeyword = '';
                    this.isSearching = false;
                    this.filterVideos();
                },

                filterVideos() {
                    this.filteredVideos = this.allVideos;
                    this.currentPage = 1;
                },

                get paginatedVideos() {
                    const start = (this.currentPage - 1) * this.pageSize;
                    const end = start + this.pageSize;
                    return this.filteredVideos.slice(start, end);
                },

                get totalPages() {
                    return Math.ceil(this.filteredVideos.length / this.pageSize) || 1;
                },

                changePage(page) {
                    if (page >= 1 && page <= this.totalPages) {
                        this.currentPage = page;
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                },

                goToPlay(vodSummary) {
                    const cat = this.categories.find(c => c.name === vodSummary.category) || this.categories[0];
                    if (!cat || !cat.file) {
                        localStorage.setItem('currentVod', JSON.stringify(vodSummary));
                        window.location.href = 'play.html';
                        return;
                    }

                    const loadPromise = cat.file ? 
                        fetch('./data/' + cat.file).then(res => res.json()) :
                        Promise.all(cat.files.map(f => fetch('./data/' + f).then(res => res.json()))).then(results => results.flat());

                    loadPromise.then(fullList => {
                        const fullVod = fullList.find(v => v.id == vodSummary.id) || vodSummary;
                        localStorage.setItem('currentVod', JSON.stringify(fullVod));
                        window.location.href = 'play.html';
                    }).catch(err => {
                        localStorage.setItem('currentVod', JSON.stringify(vodSummary));
                        window.location.href = 'play.html';
                    });
                }
            }
        }
    </script>
</body>
</html>
