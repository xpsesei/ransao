<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端影院 - 免费高清影视站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between" x-data="videoApp()">

    <!-- 顶部导航栏 -->
    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl font-black bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">🎬 云端影院</span>
            </div>
            <!-- 搜索框 -->
            <div class="w-64 md:w-96">
                <input type="text" x-model="searchKeyword" @input="filterVideos()" placeholder="在当前分类中搜索..." class="w-full bg-slate-800 border border-slate-700 rounded-full px-4 py-1.5 text-sm focus:outline-none focus:border-blue-500">
            </div>
        </div>
    </header>

    <!-- 📢 顶部横幅广告 -->
    <div class="max-w-7xl mx-auto px-4 mt-4 w-full">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center text-xs text-slate-400">
            <a href="#" target="_blank" class="hover:text-blue-400">🔥 赞助商广告：点击这里支持本站发展，解锁更多优质资源！</a>
        </div>
    </div>

    <!-- 主体内容区 -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        
        <!-- 分类导航栏（动态从 categories.json 加载，点击秒切分类） -->
        <div class="flex items-center space-x-2 overflow-x-auto pb-4 mb-6 scrollbar-none">
            <template x-for="cat in categories" :key="cat.file">
                <button @click="switchCategory(cat.file, cat.name)" 
                        :class="currentCategory === cat.name ? 'bg-blue-600 text-white font-bold shadow-lg shadow-blue-600/30' : 'bg-slate-900 text-slate-400 hover:bg-slate-800'"
                        class="px-4 py-2 rounded-xl text-sm whitespace-nowrap transition"
                        x-text="cat.name + ' (' + cat.count + ')'">
                </button>
            </template>
        </div>

        <!-- 视频网格列表 -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <template x-for="vod in filteredVideos" :key="vod.id">
                <div @click="openModal(vod)" class="bg-slate-900 rounded-xl overflow-hidden border border-slate-800 hover:border-blue-500/50 transition cursor-pointer group flex flex-col">
                    <div class="relative aspect-[3/4] bg-slate-800 overflow-hidden">
                        <img :src="vod.pic" @error="$el.src='https://via.placeholder.com/300x400?text=No+Image'" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                        <div class="absolute bottom-2 right-2 bg-black/70 backdrop-blur px-2 py-0.5 rounded text-xs text-yellow-400 font-semibold" x-text="vod.year || '最新'"></div>
                    </div>
                    <div class="p-3 flex flex-col justify-between flex-grow">
                        <h3 class="font-bold text-sm truncate text-slate-200 group-hover:text-blue-400 transition" x-text="vod.title"></h3>
                        <p class="text-xs text-slate-500 truncate mt-1" x-text="vod.actor || vod.category"></p>
                    </div>
                </div>
            </template>
        </div>

        <!-- 无数据提示 -->
        <div x-show="filteredVideos.length === 0" class="text-center py-20 text-slate-500">
            正在加载海量影视资源，请稍候...
        </div>
    </main>

    <!-- 播放详情弹窗 -->
    <div x-show="isModalOpen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4" x-cloak>
        <div @click.outside="closeModal()" class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-4xl overflow-hidden flex flex-col max-h-[90vh]">
            <!-- 弹窗头部 -->
            <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-100" x-text="currentVod?.title"></h2>
                <button @click="closeModal()" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
            </div>

            <!-- 播放器区域 -->
            <div class="w-full bg-black aspect-video relative">
                <iframe :src="currentPlayUrl" class="w-full h-full border-0" allowfullscreen></iframe>
            </div>

            <!-- 📢 播放器下方广告 -->
            <div class="bg-slate-950 px-6 py-2 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400">
                <span>💡 播放提示：如果当前线路无法播放，请尝试切换其他集数。</span>
                <a href="#" target="_blank" class="text-blue-400 hover:underline">【广告】特惠影视会员或商务合作</a>
            </div>

            <!-- 选集列表 -->
            <div class="p-6 overflow-y-auto flex-grow space-y-4">
                <div>
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">播放选集</h4>
                    <div class="flex flex-wrap gap-2 max-h-40 overflow-y-auto">
                        <template x-for="(ep, index) in currentVod?.episodes" :key="index">
                            <button @click="playEpisode(ep.url)"
                                    :class="selectedEpUrl === ep.url ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'"
                                    class="px-3 py-1.5 rounded-lg text-xs font-medium transition"
                                    x-text="ep.name">
                            </button>
                        </template>
                    </div>
                </div>

                <!-- 剧情简介 -->
                <div class="text-xs text-slate-400 border-t border-slate-800 pt-3">
                    <span class="font-bold text-slate-300">剧情介绍：</span>
                    <span x-text="currentVod?.content || '暂无简介'"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>Copyright &copy; 云端影院 All Rights Reserved. 资源来自第三方采集接口，仅供学习交流使用。</p>
    </footer>

    <script>
        function videoApp() {
            return {
                categories: [],
                allVideos: [],
                filteredVideos: [],
                currentCategory: '',
                searchKeyword: '',
                isModalOpen: false,
                currentVod: null,
                currentPlayUrl: '',
                selectedEpUrl: '',
                
                releaseBaseUrl: './data/',

                init() {
                    // 1. 加载分类索引
                    fetch(this.releaseBaseUrl + 'categories.json')
                        .then(res => res.json())
                        .then(data => { 
                            this.categories = data;
                            // 2. 自动默认加载第一个分类（如电影、电视剧等），彻底避免加载 50MB 的 all.json 导致浏览器崩溃
                            if (data && data.length > 0) {
                                this.switchCategory(data[0].file, data[0].name);
                            }
                        })
                        .catch(err => console.log('Waiting for Action release sync...'));
                },

                switchCategory(file, name) {
                    this.currentCategory = name;
                    this.filteredVideos = []; // 切换时清空防卡顿
                    fetch(this.releaseBaseUrl + file)
                        .then(res => res.json())
                        .then(data => {
                            this.allVideos = data;
                            this.filterVideos();
                        })
                        .catch(err => {
                            this.allVideos = [];
                            this.filteredVideos = [];
                        });
                },

                filterVideos() {
                    if (!this.searchKeyword) {
                        this.filteredVideos = this.allVideos;
                    } else {
                        const kw = this.searchKeyword.toLowerCase();
                        this.filteredVideos = this.allVideos.filter(v => 
                            v.title.toLowerCase().includes(kw) || 
                            (v.actor && v.actor.toLowerCase().includes(kw))
                        );
                    }
                },

                openModal(vod) {
                    this.currentVod = vod;
                    if (vod.episodes && vod.episodes.length > 0) {
                        this.playEpisode(vod.episodes[0].url);
                    } else {
                        this.currentPlayUrl = '';
                        this.selectedEpUrl = '';
                    }
                    this.isModalOpen = true;
                },

                playEpisode(url) {
                    this.selectedEpUrl = url;
                    this.currentPlayUrl = `https://jx.xllmcms.com/dplayer/?url=${encodeURIComponent(url)}`;
                },

                closeModal() {
                    this.isModalOpen = false;
                    this.currentPlayUrl = ''; 
                }
            }
        }
    </script>
</body>
</html>
