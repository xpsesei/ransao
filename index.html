<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端影院 - 免费高清影视在线观看</title>
    <meta name="description" content="云端影院提供海量高清电影、电视剧、动漫、综艺免费在线观看。">
    <link rel="stylesheet" href="./assets/style.css">
    <script defer src="./assets/alpine.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col" x-data="videoApp()">

    <!-- 顶部导航 -->
    <header class="bg-gray-900/95 backdrop-blur border-b border-gray-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <a href="index.html" class="text-xl font-bold text-amber-400 tracking-wide shrink-0">🎬 云端影院</a>
            <div class="flex-1 max-w-md flex">
                <input
                    type="text"
                    x-model="searchKeyword"
                    @keyup.enter="doSearch()"
                    placeholder="搜索片名、演员、类型..."
                    class="w-full bg-gray-800 border border-gray-700 rounded-l-lg px-3 py-1.5 text-sm focus:outline-none focus:border-amber-400"
                >
                <button @click="doSearch()" class="bg-amber-500 hover:bg-amber-400 text-gray-950 font-semibold px-4 py-1.5 rounded-r-lg text-sm transition">
                    搜索
                </button>
            </div>
        </div>
        <!-- 分类导航 -->
        <nav class="max-w-7xl mx-auto px-4 pb-2.5 flex items-center gap-2 overflow-x-auto no-scrollbar">
            <template x-for="cat in categories" :key="cat.name">
                <button
                    @click="selectCategory(cat.name)"
                    :class="!isSearchMode && currentCategory === cat.name ? 'bg-amber-500 text-gray-950 font-semibold' : 'bg-gray-800 hover:bg-gray-700 text-gray-200'"
                    class="px-3 py-1 rounded-full text-xs whitespace-nowrap transition"
                    x-text="cat.name + ' (' + cat.count + ')'"
                ></button>
            </template>
        </nav>
    </header>

    <!-- 主体内容 -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
        <div class="flex items-center justify-between mb-4">
            <h1 class="text-lg font-bold text-white" x-text="isSearchMode ? ('搜索结果：' + activeSearchQuery + '（' + searchResults.length + ' 条）') : currentCategory"></h1>
            <button x-show="isSearchMode" @click="clearSearch()" class="text-xs text-amber-400 hover:underline">
                返回分类列表
            </button>
        </div>

        <!-- 搜索加载进度条 -->
        <div x-show="isSearchMode && searchLoading" class="mb-4 text-xs text-amber-400">
            正在检索云端片库（已扫描 <span x-text="searchChunksLoaded"></span>/<span x-text="searchChunksTotal"></span> 个分片）...
        </div>

        <!-- 加载骨架 -->
        <div x-show="isLoading" class="py-24 text-center text-gray-400">
            <div class="inline-block w-8 h-8 border-4 border-amber-400 border-t-transparent rounded-full animate-spin mb-3"></div>
            <p>正在加载影视列表...</p>
        </div>

        <!-- 影视卡片网格 -->
        <div x-show="!isLoading" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-7 gap-4">
            <template x-for="vod in displayList" :key="vod.id">
                <a
                    :href="'play.html?id=' + encodeURIComponent(vod.id) + '&cat=' + encodeURIComponent(vod.category || '') + (vod.data_file ? '&file=' + encodeURIComponent(vod.data_file) : '')"
                    class="group bg-gray-900 border border-gray-800 rounded-xl overflow-hidden hover:border-amber-400/70 transition flex flex-col"
                >
                    <div class="aspect-[3/4] bg-gray-800 relative overflow-hidden">
                        <img
                            :src="vod.pic"
                            :alt="vod.title"
                            loading="lazy"
                            decoding="async"
                            referrerpolicy="no-referrer"
                            @error="$event.target.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22400%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%231f2937%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%239ca3af%22 font-size=%2214%22 text-anchor=%22middle%22>暂无封面</text></svg>'"
                            class="w-full h-full object-cover group-hover:scale-105 transition duration-300"
                        >
                        <span x-show="vod.year" class="absolute top-1.5 right-1.5 bg-black/75 text-amber-400 text-[10px] px-1.5 py-0.5 rounded" x-text="vod.year"></span>
                    </div>
                    <div class="p-2.5 flex-1 flex flex-col justify-between">
                        <h2 class="text-xs font-medium text-gray-100 line-clamp-2 group-hover:text-amber-400" x-text="vod.title"></h2>
                        <p class="text-[11px] text-gray-500 mt-1 truncate" x-text="vod.category || ''"></p>
                    </div>
                </a>
            </template>
        </div>

        <!-- 空状态 -->
        <div x-show="!isLoading && displayList.length === 0" class="py-20 text-center text-gray-500">
            暂无相关影片数据
        </div>

        <!-- 分页控制 -->
        <div x-show="!isLoading && totalPages > 1" class="mt-8 flex items-center justify-center gap-3">
            <button @click="goToPage(currentPage - 1)" :disabled="currentPage <= 1" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 disabled:opacity-40 rounded-lg text-xs transition">
                上一页
            </button>
            <span class="text-xs text-gray-400">
                第 <span class="text-white font-semibold" x-text="currentPage"></span> / <span x-text="totalPages"></span> 页
            </span>
            <button @click="goToPage(currentPage + 1)" :disabled="currentPage >= totalPages" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 disabled:opacity-40 rounded-lg text-xs transition">
                下一页
            </button>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-gray-900 border-t border-gray-800 mt-10">
        <div class="max-w-7xl mx-auto px-4 py-6 text-center text-xs text-gray-500 space-y-2">
            <div class="flex flex-wrap items-center justify-center gap-4 text-gray-400">
                <a href="index.html" class="hover:text-amber-400 transition">网站首页</a>
                <span>·</span>
                <a href="sitemap.xml" target="_blank" class="hover:text-amber-400 transition">站点地图</a>
                <span>·</span>
                <button onclick="window.scrollTo({ top: 0, behavior: 'smooth' })" class="hover:text-amber-400 transition">返回顶部</button>
            </div>
            <p>本站所有影视资源均采集自互联网公开接口，仅供技术学习与交流，不存储任何视频文件。如有侵权请联系删除。</p>
            <p class="text-gray-600">&copy; 2026 云端影院 (198616.xyz) All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        function videoApp() {
            return {
                categories: [],
                currentCategory: '🔥 最新更新',
                currentPage: 1,
                pageSize: 28,
                chunkSize: 100,
                displayList: [],
                totalPages: 1,
                isLoading: true,

                dataVersion: '',
                searchChunksTotal: 0,
                searchChunksLoaded: 0,
                searchKeyword: '',
                activeSearchQuery: '',
                isSearchMode: false,
                searchLoading: false,
                searchResults: [],
                searchCacheRows: [],
                categoryCache: {},
                inflightCategoryFiles: {},

                async initManifest() {
                    try {
                        const res = await fetch(`./data/manifest.json?_t=${Date.now()}`, { cache: 'no-store' });
                        if (res.ok) {
                            const manifest = await res.json();
                            this.dataVersion = manifest.version || '';
                            this.searchChunksTotal = manifest.search_chunks || 0;
                        }
                    } catch (e) {}
                    if (!this.dataVersion) {
                        this.dataVersion = String(Math.floor(Date.now() / 300000));
                    }
                },

                async fetchJson(url) {
                    const sep = url.includes('?') ? '&' : '?';
                    const res = await fetch(`${url}${sep}v=${encodeURIComponent(this.dataVersion)}`, { cache: 'force-cache' });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                },

                async fetchCategoryFile(filename) {
                    if (this.categoryCache[filename]) return this.categoryCache[filename];
                    if (this.inflightCategoryFiles[filename]) return this.inflightCategoryFiles[filename];

                    const promise = this.fetchJson(`./data/${encodeURIComponent(filename)}`)
                        .then(data => {
                            this.categoryCache[filename] = Array.isArray(data) ? data : [];
                            delete this.inflightCategoryFiles[filename];
                            return this.categoryCache[filename];
                        })
                        .catch(err => {
                            delete this.inflightCategoryFiles[filename];
                            throw err;
                        });
                    this.inflightCategoryFiles[filename] = promise;
                    return promise;
                },

                async init() {
                    const params = new URLSearchParams(window.location.search);
                    const catParam = params.get('cat');
                    const pageParam = parseInt(params.get('p') || '1', 10);
                    const qParam = params.get('q');

                    try {
                        await this.initManifest();
                        this.categories = await this.fetchJson('./data/categories.json');
                        if (catParam && this.categories.some(c => c.name === catParam)) {
                            this.currentCategory = catParam;
                        } else if (this.categories.length > 0) {
                            this.currentCategory = this.categories[0].name;
                        }
                        this.currentPage = pageParam > 0 ? pageParam : 1;

                        if (qParam && qParam.trim()) {
                            this.searchKeyword = qParam.trim();
                            await this.doSearch();
                        } else {
                            await this.loadCategoryPage();
                        }
                    } catch (e) {
                        console.error('Init failed:', e);
                    } finally {
                        this.isLoading = false;
                    }
                },

                async loadCategoryPage() {
                    this.isLoading = true;
                    this.isSearchMode = false;
                    try {
                        const catObj = this.categories.find(c => c.name === this.currentCategory);
                        if (!catObj) {
                            this.displayList = [];
                            this.totalPages = 1;
                            return;
                        }
                        const totalCount = catObj.count || 0;
                        this.totalPages = Math.max(1, Math.ceil(totalCount / this.pageSize));
                        if (this.currentPage > this.totalPages) this.currentPage = this.totalPages;

                        const startIdx = (this.currentPage - 1) * this.pageSize;
                        const endIdx = startIdx + this.pageSize;
                        const files = catObj.file ? [catObj.file] : (catObj.files || []);

                        const startChunk = Math.floor(startIdx / this.chunkSize);
                        const endChunk = Math.floor(Math.max(0, endIdx - 1) / this.chunkSize);
                        const neededFiles = files.slice(startChunk, endChunk + 1);

                        const chunks = await Promise.all(neededFiles.map(f => this.fetchCategoryFile(f)));
                        const merged = chunks.flat();
                        const localOffset = startIdx - startChunk * this.chunkSize;
                        this.displayList = merged.slice(localOffset, localOffset + this.pageSize);
                    } finally {
                        this.isLoading = false;
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                },

                selectCategory(catName) {
                    this.currentCategory = catName;
                    this.currentPage = 1;
                    this.updateUrl({ cat: catName, p: 1 });
                    this.loadCategoryPage();
                },

                goToPage(page) {
                    if (page < 1 || page > this.totalPages) return;
                    this.currentPage = page;
                    if (this.isSearchMode) {
                        const start = (page - 1) * this.pageSize;
                        this.displayList = this.searchResults.slice(start, start + this.pageSize);
                        this.updateUrl({ q: this.activeSearchQuery, p: page });
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    } else {
                        this.updateUrl({ cat: this.currentCategory, p: page });
                        this.loadCategoryPage();
                    }
                },

                async doSearch() {
                    const kw = this.searchKeyword.trim().toLowerCase();
                    if (!kw) return;

                    this.isSearchMode = true;
                    this.activeSearchQuery = this.searchKeyword.trim();
                    this.currentPage = 1;
                    this.searchResults = [];
                    this.displayList = [];
                    this.isLoading = false;
                    this.updateUrl({ q: this.activeSearchQuery, p: 1 });

                    if (this.searchLoading) return;

                    if (this.searchChunksLoaded < this.searchChunksTotal) {
                        this.searchLoading = true;
                        const batchSize = 3;
                        for (let i = this.searchChunksLoaded; i < this.searchChunksTotal; i += batchSize) {
                            const indices = [];
                            for (let j = i; j < Math.min(i + batchSize, this.searchChunksTotal); j++) {
                                indices.push(j);
                            }
                            const loadedBatches = await Promise.all(
                                indices.map(idx => this.fetchJson(`./data/search/part_${idx}.json`).catch(() => []))
                            );
                            for (const rows of loadedBatches) {
                                this.searchCacheRows.push(...rows);
                            }
                            this.searchChunksLoaded = Math.min(i + batchSize, this.searchChunksTotal);
                            this.filterCachedSearch(this.activeSearchQuery.toLowerCase());
                        }
                        this.searchLoading = false;
                    } else {
                        this.filterCachedSearch(kw);
                    }
                },

                filterCachedSearch(kw) {
                    const matched = [];
                    for (const row of this.searchCacheRows) {
                        const text = `${row[1]} ${row[4]} ${row[2]} ${row[5]}`.toLowerCase();
                        if (text.includes(kw)) {
                            matched.push({
                                id: row[0],
                                title: row[1],
                                category: row[2],
                                pic: row[3],
                                actor: row[4],
                                year: row[5],
                                data_file: row[6],
                            });
                        }
                    }
                    this.searchResults = matched;
                    this.totalPages = Math.max(1, Math.ceil(matched.length / this.pageSize));
                    const start = (this.currentPage - 1) * this.pageSize;
                    this.displayList = matched.slice(start, start + this.pageSize);
                },

                clearSearch() {
                    this.searchKeyword = '';
                    this.isSearchMode = false;
                    this.currentPage = 1;
                    this.updateUrl({ cat: this.currentCategory, p: 1 });
                    this.loadCategoryPage();
                },

                updateUrl(obj) {
                    const url = new URL(window.location.href);
                    url.search = '';
                    Object.entries(obj).forEach(([k, v]) => {
                        if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, v);
                    });
                    history.replaceState(null, '', url.toString());
                }
            };
        }
    </script>
