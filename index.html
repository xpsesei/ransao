<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端影院 - 免费高清影视站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        /* 隐藏滚动条但保持平滑滚动 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white" x-data="videoApp()">

    <!-- 顶部导航栏（全平台毛玻璃自适应） -->
    <header class="sticky top-0 z-50 bg-slate-900/85 backdrop-blur-md border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 h-16 flex items-center justify-between gap-3">
            <div class="flex items-center space-x-2 shrink-0">
                <a href="index.html" class="text-xl sm:text-2xl font-black bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500 bg-clip-text text-transparent">
                    🎬 云端影院
                </a>
            </div>
            <!-- 全局搜索框（响应式宽度） -->
            <div class="flex-grow max-w-xs sm:max-w-sm md:max-w-md relative">
                <input type="text" 
                       x-model="searchKeyword" 
                       @focus="initSearchIndex()" 
                       @input="onGlobalSearch()" 
                       placeholder="搜索片名、演员..." 
                       class="w-full bg-slate-800/90 border border-slate-700/80 rounded-full px-4 py-1.5 text-xs sm:text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-slate-100 placeholder-slate-400 transition">
            </div>
        </div>
    </header>

    <!-- 主体内容区 -->
    <main class="max-w-7xl mx-auto px-3 sm:px-6 py-4 sm:py-6 flex-grow w-full">
        
        <!-- 分类导航栏（触控优化 + 平滑滚动） -->
        <div class="flex items-center space-x-2 overflow-x-auto pb-3 mb-5 no-scrollbar">
            <button @click="switchCategoryByName('🔥 最新更新')" 
                    :class="!isSearching && currentCategory === '🔥 最新更新' ? 'bg-blue-600 text-white font-bold shadow-lg shadow-blue-600/30 ring-2 ring-blue-400/30' : 'bg-slate-900/90 text-slate-400 hover:bg-slate-800 hover:text-slate-200'"
                    class="px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl text-xs sm:text-sm whitespace-nowrap transition flex items-center space-x-1 shrink-0">
                <span>🔥 最新更新</span>
            </button>

            <template x-for="cat in categories" :key="cat.name">
                <template x-if="cat.name !== '🔥 最新更新'">
                    <button @click="switchCategory(cat)" 
                            :class="!isSearching && currentCategory === cat.name ? 'bg-blue-600 text-white font-bold shadow-lg shadow-blue-600/30 ring-2 ring-blue-400/30' : 'bg-slate-900/90 text-slate-400 hover:bg-slate-800 hover:text-slate-200'"
                            class="px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl text-xs sm:text-sm whitespace-nowrap transition shrink-0"
                            x-text="cat.name + (cat.count ? ' (' + cat.count + ')' : '')">
                    </button>
                </template>
            </template>
        </div>

        <!-- 搜索状态提示栏 -->
        <div x-show="isSearching" class="mb-4 text-xs sm:text-sm text-blue-400 flex items-center justify-between bg-blue-950/30 border border-blue-900/50 px-4 py-2.5 rounded-xl">
            <span class="truncate pr-2">🔍 全局搜索：“<span class="font-bold text-white" x-text="searchKeyword"></span>”，找到 <span class="font-bold text-white" x-text="filteredVideos.length"></span> 部影视</span>
            <button @click="clearSearch()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded-lg text-slate-300 transition shrink-0">退出</button>
        </div>

        <!-- 广告容器（自适应居中） -->
        <div class="flex justify-center my-4 overflow-hidden">
            <script async type="application/javascript" src="https://a.magsrv.com/ad-provider.js"></script> 
            <ins class="eas6a97888e20" data-zoneid="6080530"></ins> 
            <script>(AdProvider = window.AdProvider || []).push({"serve": {}});</script>
        </div>

        <!-- 视频网格列表（全平台自适应栅格：手机2列，平板3-4列，桌面6列） -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 sm:gap-4">
            <template x-for="vod in paginatedVideos" :key="vod.id">
                <div @click="goToPlay(vod)" class="bg-slate-900/90 rounded-2xl overflow-hidden border border-slate-800/80 hover:border-blue-500/50 transition-all duration-300 cursor-pointer group flex flex-col shadow-lg hover:shadow-blue-500/1{-hover:-translate-y-0.5}">
                    <div class="relative aspect-[3/4] bg-slate-950 overflow-hidden">
                        <img :src="vod.pic" @error="$el.src='https://via.placeholder.com/300x400?text=No+Image'" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy" decoding="async">
                        <div class="absolute bottom-2 right-2 bg-black/75 backdrop-blur-md px-2 py-0.5 rounded-md text-[10px] sm:text-xs text-yellow-400 font-bold shadow" x-text="vod.year || '最新'"></div>
                    </div>
                    <div class="p-2.5 sm:p-3 flex flex-col justify-between flex-grow">
                        <h3 class="font-bold text-xs sm:text-sm truncate text-slate-200 group-hover:text-blue-400 transition" x-text="vod.title"></h3>
                        <p class="text-[10px] sm:text-xs text-slate-500 truncate mt-1" x-text="vod.actor || vod.category"></p>
                    </div>
                </div>
            </template>
        </div>

        <!-- 加载或空状态提示 -->
        <div x-show="filteredVideos.length === 0" class="text-center py-24 text-slate-500 text-sm">
            正在从云端高速加载中...
        </div>

        <!-- 📄 分页控制条 -->
        <div x-show="totalPages > 1" class="flex justify-center items-center space-x-3 mt-10">
            <button @click="changePage(currentPage - 1)" :disabled="currentPage === 1"
                    class="px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs sm:text-sm text-slate-300 disabled:opacity-30 disabled:cursor-not-allowed hover:bg-slate-800 hover:text-white transition shadow">
                上一页
            </button>
            <span class="text-xs sm:text-sm text-slate-400">
                第 <span class="text-blue-400 font-bold" x-text="currentPage"></span> / <span x-text="totalPages"></span> 页
            </span>
            <button @click="changePage(currentPage + 1)" :disabled="currentPage >= totalPages"
                    class="px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs sm:text-sm text-slate-300 disabled:opacity-30 disabled:cursor-not-allowed hover:bg-slate-800 hover:text-white transition shadow">
                下一页
            </button>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-slate-900/60 border-t border-slate-800/80 py-6 text-center text-[11px] sm:text-xs text-slate-500 mt-12">
        <p>Copyright &copy; 云端影院 All Rights Reserved. 资源来自第三方采集接口，仅供学习交流使用。</p>
    </footer>

    <script>
        function videoApp() {
            return {
                categories: [],
                allVideos: [],
                searchIndex: [],
                filteredVideos: [],
                currentCategory: '🔥 最新更新',
                searchKeyword: '',
                isSearching: false,
                isSearchIndexLoaded: false,
                
                currentPage: 1,
                pageSize: 28,

                init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const paramCat = urlParams.get('cat');
                    const paramPage = parseInt(urlParams.get('p')) || 1;
                    const paramQ = urlParams.get('q');

                    if (paramPage > 1) this.currentPage = paramPage;
                    if (paramQ) {
                        this.searchKeyword = paramQ;
                        this.isSearching = true;
                    }

                    // 1. 加载分类索引
                    fetch('./data/categories.json')
                        .then(res => res.json())
                        .then(data => { 
                            this.categories = data || [];
                            
                            let targetCat = this.categories[0];
                            if (paramCat) {
                                const found = this.categories.find(c => c.name === paramCat);
                                if (found) targetCat = found;
                            } else {
                                const latest = this.categories.find(c => c.name.includes('最新'));
                                if (latest) targetCat = latest;
                            }

                            if (targetCat) {
                                this.switchCategory(targetCat, false);
                            }

                            if (paramQ) {
                                this.initSearchIndex(() => {
                                    this.onGlobalSearch(false);
                                });
                            }

                            setTimeout(() => {
                                this.lazyPrefetchCategories();
                            }, 1500);
                        })
                        .catch(err => console.log('Waiting for categories sync...'));
                },

                initSearchIndex(callback) {
                    if (this.isSearchIndexLoaded) {
                        if (callback) callback();
                        return;
                    }
                    fetch('./data/search_index.json')
                        .then(res => res.json())
                        .then(data => {
                            this.searchIndex = data || [];
                            this.isSearchIndexLoaded = true;
                            if (callback) callback();
                        })
                        .catch(err => console.log('Search index load failed'));
                },

                lazyPrefetchCategories() {
                    if (!this.categories || this.categories.length === 0) return;
                    let index = 0;
                    const prefetchNext = () => {
                        if (index >= Math.min(this.categories.length, 5)) return;
                        const cat = this.categories[index++];
                        let filesToFetch = cat.file ? [cat.file] : (cat.files || []);
                        if (filesToFetch.length > 0) {
                            const cacheKey = `vod_cache_${cat.name}`;
                            if (!sessionStorage.getItem(cacheKey)) {
                                Promise.all(filesToFetch.map(f => 
                                    fetch('./data/' + f).then(res => res.json()).catch(err => [])
                                ))
                                .then(results => {
                                    const merged = results.flat();
                                    try { sessionStorage.setItem(cacheKey, JSON.stringify(merged)); } catch (e) {}
                                    setTimeout(prefetchNext, 800);
                                }).catch(err => { setTimeout(prefetchNext, 800); });
                            } else { prefetchNext(); }
                        } else { prefetchNext(); }
                    };
                    prefetchNext();
                },

                updateUrl() {
                    const params = new URLSearchParams();
                    if (this.currentCategory && this.currentCategory !== '🔥 最新更新') {
                        params.set('cat', this.currentCategory);
                    }
                    if (this.currentPage > 1) {
                        params.set('p', this.currentPage);
                    }
                    if (this.isSearching && this.searchKeyword.trim()) {
                        params.set('q', this.searchKeyword.trim());
                    }
                    const newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
                    history.replaceState(null, '', newUrl);
                },

                switchCategoryByName(name) {
                    const cat = this.categories.find(c => c.name === name);
                    if (cat) { this.switchCategory(cat); }
                },

                switchCategory(cat, resetPage = true) {
                    if (!cat) return;
                    this.isSearching = false;
                    this.searchKeyword = '';
                    this.currentCategory = cat.name;
                    if (resetPage) { this.currentPage = 1; }
                    this.allVideos = [];
                    this.filteredVideos = [];
                    
                    this.updateUrl();

                    const cacheKey = `vod_cache_${cat.name}`;
                    const cachedData = sessionStorage.getItem(cacheKey);
                    if (cachedData) {
                        try {
                            this.allVideos = JSON.parse(cachedData);
                            this.filterVideos();
                            return;
                        } catch (e) {}
                    }

                    let filesToFetch = cat.file ? [cat.file] : (cat.files || []);
                    if (filesToFetch.length === 0) return;

                    Promise.all(filesToFetch.map(f => 
                        fetch('./data/' + f).then(res => res.json()).catch(err => [])
                    ))
                    .then(results => {
                        const merged = results.flat();
                        this.allVideos = merged;
                        this.filterVideos();
                        try { sessionStorage.setItem(cacheKey, JSON.stringify(merged)); } catch (e) {}
                    })
                    .catch(err => { 
                        this.allVideos = []; 
                        this.filteredVideos = []; 
                    });
                },

                onGlobalSearch(updateHistory = true) {
                    if (!this.searchKeyword.trim()) {
                        this.clearSearch();
                        return;
                    }

                    this.isSearching = true;
                    if (updateHistory) { this.currentPage = 1; }
                    const kw = this.searchKeyword.toLowerCase();

                    if (!this.isSearchIndexLoaded) {
                        this.initSearchIndex(() => {
                            this.performSearch(kw, updateHistory);
                        });
                    } else {
                        this.performSearch(kw, updateHistory);
                    }
                },

                performSearch(kw, updateHistory) {
                    if (this.searchIndex.length > 0) {
                        this.filteredVideos = this.searchIndex.filter(v => 
                            (v.title && v.title.toLowerCase().includes(kw)) || 
                            (v.actor && v.actor.toLowerCase().includes(kw))
                        );
                    } else {
                        this.filteredVideos = this.allVideos.filter(v => 
                            (v.title && v.title.toLowerCase().includes(kw)) || 
                            (v.actor && v.actor.toLowerCase().includes(kw))
                        );
                    }
                    if (updateHistory) { this.updateUrl(); }
                },

                clearSearch() {
                    this.searchKeyword = '';
                    this.isSearching = false;
                    const latestCat = this.categories.find(c => c.name.includes('最新')) || this.categories[0];
                    if (latestCat) { this.switchCategory(latestCat); }
                },

                filterVideos() {
                    this.filteredVideos = this.allVideos;
                },

                get paginatedVideos() {
                    const start = (this.currentPage - 1) * this.pageSize;
                    return this.filteredVideos.slice(start, start + this.pageSize);
                },

                get totalPages() {
                    return Math.ceil(this.filteredVideos.length / this.pageSize) || 1;
                },

                changePage(page) {
                    if (page >= 1 && page <= this.totalPages) {
                        this.currentPage = page;
                        this.updateUrl();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                },

                goToPlay(vodSummary) {
                    window.location.href = `play.html?id=${vodSummary.id}&cat=${encodeURIComponent(vodSummary.category)}`;
                }
            }
        }
    </script>
    <script charset="UTF-8" id="LA_COLLECT" src="//sdk.51.la/js-sdk-pro.min.js"></script>

</body>
</html>
