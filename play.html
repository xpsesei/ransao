<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在播放 - 云端影院</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        /* 原生全屏时的样式适配 */
        #player-container:fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #player-container:-webkit-full-screen {
            width: 100vw !important;
            height: 100vh !important;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between" x-data="playApp()">

    <!-- 顶部导航栏与搜索 -->
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center space-x-3 shrink-0">
                <a href="index.html" class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">🎬 云端影院</a>
            </div>
            <!-- 全局搜索框 -->
            <div class="w-full max-w-md relative">
                <input type="text" x-model="searchKeyword" @keyup.enter="doSearch()" placeholder="全网全局搜索（片名、演员）..." class="w-full bg-slate-800 border border-slate-700 rounded-full px-4 py-1.5 text-sm focus:outline-none focus:border-blue-500 text-slate-100">
            </div>
        </div>
        <!-- 分类导航条 -->
        <div class="max-w-7xl mx-auto px-4 py-2 flex items-center space-x-2 overflow-x-auto border-t border-slate-800/60 scrollbar-none">
            <a href="index.html" class="px-3 py-1 bg-slate-800 text-slate-300 hover:bg-slate-700 rounded-xl text-xs whitespace-nowrap transition">首页</a>
            <template x-for="cat in categories" :key="cat.name">
                <button @click="selectCategory(cat)" 
                        class="px-3 py-1 bg-slate-900 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl text-xs whitespace-nowrap transition"
                        x-text="cat.name">
                </button>
            </template>
        </div>
    </header>

    <!-- 主体播放区域 -->
    <main class="max-w-5xl mx-auto px-4 py-6 flex-grow w-full space-y-4">
        
        <!-- 视频标题 -->
        <div>
            <h1 class="text-xl md:text-2xl font-bold text-slate-100" x-text="vod?.title || '加载中...'"></h1>
            <p class="text-xs text-slate-400 mt-1" x-text="'类型：' + (vod?.category || '') + ' | 年份：' + (vod?.year || '') + ' | 地区：' + (vod?.area || '')"></p>
        </div>

        <!-- 🚀 核心：集成了播放器、上下集、选集抽屉和全屏控制的容器 -->
        <div id="player-container" class="w-full bg-black aspect-video rounded-2xl overflow-hidden border border-slate-800 shadow-2xl relative group">
            
            <!-- 播放器 iframe -->
            <iframe :src="currentPlayUrl" class="w-full h-full border-0"></iframe>

            <!-- 📺 悬浮在播放器下方的控制条（在全屏和非全屏下都完美显示） -->
            <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/95 via-black/60 to-transparent p-3 flex items-center justify-between transition opacity-90 group-hover:opacity-100 z-10">
                <div class="flex items-center space-x-2">
                    <button @click="playPrev()" :disabled="currentIndex === 0" 
                            class="px-3 py-1.5 bg-slate-800/90 hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed rounded-lg text-xs font-medium text-white backdrop-blur transition">
                        ◀ 上一集
                    </button>
                    <button @click="playNext()" :disabled="!vod?.episodes || currentIndex >= vod.episodes.length - 1" 
                            class="px-3 py-1.5 bg-blue-600/90 hover:bg-blue-500 disabled:opacity-30 disabled:cursor-not-allowed rounded-lg text-xs font-medium text-white backdrop-blur transition shadow">
                        下一集 ▶
                    </button>
                    <button @click="isDrawerOpen = !isDrawerOpen" 
                            class="px-3 py-1.5 bg-slate-800/90 hover:bg-slate-700 rounded-lg text-xs font-medium text-blue-400 backdrop-blur transition border border-slate-700">
                        📂 选集 (<span class="text-white" x-text="(currentIndex + 1) + '/' + (vod?.episodes?.length || 0)"></span>)
                    </button>
                </div>

                <!-- 容器全屏切换按钮 -->
                <button @click="toggleFullscreen()" class="px-3 py-1.5 bg-slate-800/90 hover:bg-slate-700 rounded-lg text-xs font-medium text-white backdrop-blur transition">
                    <span x-text="isFullscreen ? '退出全屏' : '全屏 ⛶'"></span>
                </button>
            </div>

            <!-- 📂 悬浮选集抽屉面板（点击选集后从右侧滑出，全屏时也能正常操作） -->
            <div x-show="isDrawerOpen" @click.outside="isDrawerOpen = false" x-cloak 
                 class="absolute inset-y-0 right-0 w-72 bg-slate-900/95 backdrop-blur-md border-l border-slate-800 p-4 flex flex-col shadow-2xl transition transform z-20">
                <div class="flex justify-between items-center pb-3 border-b border-slate-800">
                    <h4 class="text-xs font-bold text-slate-200 uppercase tracking-wider">全集选单</h4>
                    <button @click="isDrawerOpen = false" class="text-slate-400 hover:text-white font-bold text-base">&times;</button>
                </div>
                <div class="flex-grow overflow-y-auto py-3 space-y-1.5 pr-1">
                    <template x-for="(ep, index) in vod?.episodes" :key="index">
                        <button @click="playEpisode(ep.url, index); isDrawerOpen = false;"
                                :class="currentIndex === index ? 'bg-blue-600 text-white font-bold shadow' : 'bg-slate-800/60 text-slate-300 hover:bg-slate-800'"
                                class="w-full text-left px-3 py-2 rounded-xl text-xs transition truncate"
                                x-text="ep.name">
                        </button>
                    </template>
                </div>
            </div>

        </div>

        <!-- 剧情简介 -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 text-sm text-slate-400 space-y-2">
            <h4 class="font-bold text-slate-200">剧情介绍</h4>
            <p class="leading-relaxed" x-text="vod?.content || '暂无简介'"></p>
        </div>

    </main>

    <!-- 页脚 -->
    <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>Copyright &copy; 云端影院 All Rights Reserved. 资源来自第三方采集接口，仅供学习交流使用。</p>
    </footer>

    <script>
        function playApp() {
            return {
                vod: null,
                categories: [],
                searchKeyword: '',
                currentPlayUrl: '',
                selectedEpUrl: '',
                currentIndex: 0,
                isDrawerOpen: false,
                isFullscreen: false,

                init() {
                    // 监听浏览器的全屏状态变化
                    document.addEventListener('fullscreenchange', () => {
                        this.isFullscreen = !!document.fullscreenElement;
                    });
                    document.addEventListener('webkitfullscreenchange', () => {
                        this.isFullscreen = !!document.webkitFullscreenElement;
                    });

                    // 加载分类列表用于顶部导航
                    fetch('./data/categories.json')
                        .then(res => res.json())
                        .then(data => { this.categories = data; })
                        .catch(err => console.log('Failed to load categories'));

                    // 加载当前播放视频
                    const data = localStorage.getItem('currentVod');
                    if (data) {
                        try {
                            this.vod = JSON.parse(data);
                            if (this.vod.episodes && this.vod.episodes.length > 0) {
                                this.playEpisode(this.vod.episodes[0].url, 0);
                            }
                        } catch (e) {
                            console.error('Failed to parse vod data');
                        }
                    }
                },

                playEpisode(url, index) {
                    this.selectedEpUrl = url;
                    this.currentIndex = index;
                    this.currentPlayUrl = `https://jx.xllmcms.com/dplayer/?url=${encodeURIComponent(url)}`;
                },

                playPrev() {
                    if (this.vod && this.vod.episodes && this.currentIndex > 0) {
                        const targetIndex = this.currentIndex - 1;
                        this.playEpisode(this.vod.episodes[targetIndex].url, targetIndex);
                    }
                },

                playNext() {
                    if (this.vod && this.vod.episodes && this.currentIndex < this.vod.episodes.length - 1) {
                        const targetIndex = this.currentIndex + 1;
                        this.playEpisode(this.vod.episodes[targetIndex].url, targetIndex);
                    }
                },

                toggleFullscreen() {
                    const container = document.getElementById('player-container');
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        if (container.requestFullscreen) {
                            container.requestFullscreen();
                        } else if (container.webkitRequestFullscreen) {
                            container.webkitRequestFullscreen();
                        }
                    } else {
                        if (document.exitFullscreen) {
                            document.exitFullscreen();
                        } else if (document.webkitExitFullscreen) {
                            document.webkitExitFullscreen();
                        }
                    }
                },

                selectCategory(cat) {
                    localStorage.setItem('targetCategory', cat.name);
                    window.location.href = 'index.html';
                },

                doSearch() {
                    if (this.searchKeyword.trim()) {
                        localStorage.setItem('targetSearch', this.searchKeyword.trim());
                        window.location.href = 'index.html';
                    }
                }
            }
        }
    </script>
</body>
</html>
