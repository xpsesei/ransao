<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在播放 - 云端影院</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between" x-data="playApp()">

    <!-- 顶部导航栏 -->
    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-slate-400 hover:text-white text-sm font-semibold flex items-center space-x-1">
                    <span>← 返回首页</span>
                </a>
                <span class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">🎬 云端影院</span>
            </div>
        </div>
    </header>

    <!-- 主体播放区域 -->
    <main class="max-w-5xl mx-auto px-4 py-6 flex-grow w-full space-y-4">
        
        <!-- 视频标题与基本信息 -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-2">
            <div>
                <h1 class="text-xl md:text-2xl font-bold text-slate-100" x-text="vod?.title || '加载中...'"></h1>
                <p class="text-xs text-slate-400 mt-1" x-text="'类型：' + (vod?.category || '') + ' | 年份：' + (vod?.year || '') + ' | 地区：' + (vod?.area || '')"></p>
            </div>
            
            <!-- 快捷上/下集按钮（方便随时切集） -->
            <div class="flex items-center space-x-2">
                <button @click="playPrev()" :disabled="currentIndex === 0" 
                        class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed rounded-xl text-xs font-medium text-slate-200 transition">
                    ◀ 上一集
                </button>
                <button @click="playNext()" :disabled="!vod?.episodes || currentIndex >= vod.episodes.length - 1" 
                        class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 disabled:cursor-not-allowed rounded-xl text-xs font-medium text-white transition shadow-lg shadow-blue-600/30">
                    下一集 ▶
                </button>
            </div>
        </div>

        <!-- 播放器容器 -->
        <div class="w-full bg-black aspect-video rounded-2xl overflow-hidden border border-slate-800 shadow-2xl relative">
            <iframe :src="currentPlayUrl" class="w-full h-full border-0" allowfullscreen webkitallowfullscreen mozallowfullscreen></iframe>
        </div>

        <!-- 选集列表 -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
            <div class="flex justify-between items-center">
                <h4 class="text-sm font-bold text-slate-300 uppercase tracking-wider">播放选集</h4>
                <span class="text-xs text-slate-500" x-text="'共 ' + (vod?.episodes?.length || 0) + ' 集'"></span>
            </div>
            <div class="flex flex-wrap gap-2 max-h-48 overflow-y-auto pr-1">
                <template x-for="(ep, index) in vod?.episodes" :key="index">
                    <button @click="playEpisode(ep.url, index)"
                            :class="currentIndex === index ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30 font-bold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'"
                            class="px-3.5 py-2 rounded-xl text-xs transition"
                            x-text="ep.name">
                    </button>
                </template>
            </div>
        </div>

        <!-- 剧情简介 -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 text-sm text-slate-400 space-y-2">
            <h4 class="font-bold text-slate-200">剧情介绍</h4>
            <p class="leading-relaxed" x-text="vod?.content || '暂无简介'"></p>
        </div>

    </main>

    <!-- 页脚 -->
    <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>Copyright &copy; 云端影院 All Rights Reserved. 资源来自第三方采集接口，仅供学习交流使用。</p>
    </footer>

    <script>
        function playApp() {
            return {
                vod: null,
                currentPlayUrl: '',
                selectedEpUrl: '',
                currentIndex: 0, // 当前播放集数索引

                init() {
                    const data = localStorage.getItem('currentVod');
                    if (data) {
                        try {
                            this.vod = JSON.parse(data);
                            if (this.vod.episodes && this.vod.episodes.length > 0) {
                                this.playEpisode(this.vod.episodes[0].url, 0);
                            }
                        } catch (e) {
                            console.error('Failed to parse vod data');
                        }
                    }
                },

                playEpisode(url, index) {
                    this.selectedEpUrl = url;
                    this.currentIndex = index;
                    this.currentPlayUrl = `https://jx.xllmcms.com/dplayer/?url=${encodeURIComponent(url)}`;
                },

                playPrev() {
                    if (this.vod && this.vod.episodes && this.currentIndex > 0) {
                        const targetIndex = this.currentIndex - 1;
                        this.playEpisode(this.vod.episodes[targetIndex].url, targetIndex);
                    }
                },

                playNext() {
                    if (this.vod && this.vod.episodes && this.currentIndex < this.vod.episodes.length - 1) {
                        const targetIndex = this.currentIndex + 1;
                        this.playEpisode(this.vod.episodes[targetIndex].url, targetIndex);
                    }
                }
            }
        }
    </script>
</body>
</html>
