<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">正在加载 - 云端影院</title>
    <meta id="page-desc" name="description" content="云端影院提供免费高清影视在线观看与全集选集。">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] {
            display: none !important;
        }

        /* 全屏时播放器、控制栏、选集列表共同占据全屏容器 */
        #player-shell:fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
            border: 0;
            border-radius: 0;
            background: #020617;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: hidden;
        }

        #player-shell:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
            border: 0;
            border-radius: 0;
            background: #020617;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: hidden;
        }

        #player-shell:fullscreen #player-container,
        #player-shell:-webkit-full-screen #player-container {
            flex: 1 1 auto;
            width: 100%;
            height: auto;
            min-height: 0;
            aspect-ratio: auto;
        }

        #player-shell:fullscreen #player-controls,
        #player-shell:-webkit-full-screen #player-controls {
            flex: 0 0 auto;
        }

        #player-shell:fullscreen #episode-panel,
        #player-shell:-webkit-full-screen #episode-panel {
            flex: 0 1 30vh;
            min-height: 0;
            overflow: hidden;
        }

        #player-shell:fullscreen #episode-list,
        #player-shell:-webkit-full-screen #episode-list {
            max-height: 22vh;
            overflow-y: auto;
        }

        @media (max-width: 640px) {
            #player-shell:fullscreen,
            #player-shell:-webkit-full-screen {
                padding: 8px;
                gap: 8px;
            }
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between" x-data="playApp()">

    <!-- 顶部导航栏与搜索 -->
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center space-x-3 shrink-0">
                <a href="index.html" class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
                    🎬 云端影院
                </a>
            </div>

            <div class="w-full max-w-md relative">
                <input
                    type="text"
                    x-model="searchKeyword"
                    @keyup.enter="doSearch()"
                    placeholder="全网全局搜索（片名、演员）..."
                    class="w-full bg-slate-800 border border-slate-700 rounded-full px-4 py-1.5 text-sm focus:outline-none focus:border-blue-500 text-slate-100">
            </div>
        </div>

        <!-- 分类导航 -->
        <div class="max-w-7xl mx-auto px-4 py-2 flex items-center space-x-2 overflow-x-auto border-t border-slate-800/60 scrollbar-none">
            <a href="index.html" class="px-3 py-1 bg-slate-800 text-slate-300 hover:bg-slate-700 rounded-xl text-xs whitespace-nowrap transition">
                首页
            </a>
            <template x-for="cat in categories" :key="cat.name">
                <button
                    @click="selectCategory(cat)"
                    class="px-3 py-1 bg-slate-900 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl text-xs whitespace-nowrap transition"
                    x-text="cat.name">
                </button>
            </template>
        </div>
    </header>

    <!-- 广告：保留原样 -->
    <center>
        <script async type="application/javascript" src="https://a.magsrv.com/ad-provider.js"></script>
        <ins class="eas6a97888e20" data-zoneid="6080530"></ins>
        <script>(AdProvider = window.AdProvider || []).push({"serve": {}});</script>
    </center>

    <!-- 主体播放区域 -->
    <main class="max-w-5xl mx-auto px-4 py-6 flex-grow w-full space-y-4">

        <!-- 视频信息 -->
        <div>
            <h1
                class="text-xl md:text-2xl font-bold text-slate-100"
                x-text="vod?.title || (isLoading ? '正在加载影视数据...' : '影片信息')">
            </h1>

            <p
                x-show="vod"
                class="text-xs text-slate-400 mt-1"
                x-text="'类型：' + (vod?.category || '') + ' | 年份：' + (vod?.year || '') + ' | 地区：' + (vod?.area || '') + ' | 主演：' + (vod?.actor || '')">
            </p>

            <p
                x-show="loadError"
                x-text="loadError"
                class="text-sm text-red-400 mt-3"
                role="alert">
            </p>
        </div>

        <!-- 全屏容器：播放器与外部控制栏一起进入全屏 -->
        <section
            id="player-shell"
            class="w-full space-y-3"
            aria-label="视频播放器和播放控制">

            <!-- 播放器：控制按钮不覆盖此区域 -->
            <div
                id="player-container"
                class="w-full bg-black aspect-video rounded-2xl overflow-hidden border border-slate-800 shadow-2xl">
                <iframe
                    :src="currentPlayUrl"
                    class="w-full h-full border-0"
                    allowfullscreen="true"
                    webkitallowfullscreen="true"
                    mozallowfullscreen="true"
                    allow="fullscreen">
                </iframe>
            </div>

            <!-- 控制栏：在 iframe 外部，不遮挡播放器功能和进度条 -->
            <div
                id="player-controls"
                class="bg-slate-900/95 border border-slate-800 rounded-2xl p-3 sm:p-4">
                <div class="flex items-center justify-between gap-2 sm:gap-4">

                    <button
                        @click="playPrev()"
                        :disabled="!vod?.episodes?.length || currentIndex <= 0"
                        class="min-h-11 px-3 sm:px-5 rounded-xl bg-slate-800 text-slate-200 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed transition flex items-center justify-center gap-2"
                        aria-label="播放上一集"
                        title="上一集">
                        <span class="text-lg" aria-hidden="true">⏮</span>
                        <span class="text-sm whitespace-nowrap">上一集</span>
                    </button>

                    <div class="min-w-0 flex-1 text-center">
                        <p class="text-xs text-slate-500">正在播放</p>
                        <p
                            class="text-sm text-slate-200 font-medium truncate"
                            x-text="vod?.episodes?.[currentIndex]?.name || '暂无播放集数'">
                        </p>
                        <p
                            class="text-xs text-slate-500 mt-0.5"
                            x-text="vod?.episodes?.length ? `${currentIndex + 1} / ${vod.episodes.length} 集` : '暂无选集'">
                        </p>
                    </div>

                    <button
                        @click="isDrawerOpen = !isDrawerOpen"
                        :disabled="!vod?.episodes?.length"
                        :aria-expanded="isDrawerOpen.toString()"
                        class="min-h-11 px-3 sm:px-5 rounded-xl bg-blue-600 text-white hover:bg-blue-500 disabled:opacity-40 disabled:cursor-not-allowed transition flex items-center justify-center gap-2"
                        aria-label="打开或收起选集列表"
                        title="选集">
                        <span class="text-lg" aria-hidden="true">☷</span>
                        <span class="text-sm whitespace-nowrap" x-text="isDrawerOpen ? '收起选集' : '选集'"></span>
                    </button>

                    <button
                        @click="playNext()"
                        :disabled="!vod?.episodes?.length || currentIndex >= vod.episodes.length - 1"
                        class="min-h-11 px-3 sm:px-5 rounded-xl bg-slate-800 text-slate-200 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed transition flex items-center justify-center gap-2"
                        aria-label="播放下一集"
                        title="下一集">
                        <span class="text-sm whitespace-nowrap">下一集</span>
                        <span class="text-lg" aria-hidden="true">⏭</span>
                    </button>

                    <button
                        @click="toggleFullscreen()"
                        class="min-h-11 w-11 sm:w-auto sm:px-4 rounded-xl bg-slate-800 text-amber-300 hover:bg-slate-700 transition flex items-center justify-center gap-2"
                        :aria-label="isFullscreen ? '退出全屏' : '进入全屏'"
                        :title="isFullscreen ? '退出全屏' : '进入全屏'">
                        <span class="text-lg" aria-hidden="true" x-text="isFullscreen ? '⛶' : '⛶'"></span>
                        <span
                            class="hidden sm:inline text-sm whitespace-nowrap"
                            x-text="isFullscreen ? '退出全屏' : '全屏'">
                        </span>
                    </button>
                </div>
            </div>

            <!-- 选集面板：在播放器外部正常排版，不覆盖画面 -->
            <div
                id="episode-panel"
                x-show="isDrawerOpen"
                x-cloak
                class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5">
                <div class="flex justify-between items-center gap-3 mb-3">
                    <div>
                        <h4 class="text-sm font-bold text-slate-200">选择剧集</h4>
                        <p class="text-xs text-slate-500 mt-1">点击集数即可切换播放</p>
                    </div>
                    <button
                        @click="isDrawerOpen = false"
                        class="min-h-10 px-3 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition"
                        aria-label="收起选集列表">
                        收起
                    </button>
                </div>

                <div
                    id="episode-list"
                    class="flex flex-wrap gap-2 max-h-56 overflow-y-auto pr-1">
                    <template x-for="(ep, index) in vod?.episodes" :key="index">
                        <button
                            @click="playEpisode(ep.url, index); isDrawerOpen = false;"
                            :aria-current="currentIndex === index ? 'true' : 'false'"
                            :class="currentIndex === index
                                ? 'bg-blue-600 text-white font-bold ring-2 ring-blue-400/40'
                                : 'bg-slate-800 text-slate-300 hover:bg-slate-700'"
                            class="min-h-10 px-4 rounded-lg text-sm transition"
                            x-text="ep.name || `第 ${index + 1} 集`">
                        </button>
                    </template>
                </div>
            </div>
        </section>

        <!-- 剧情简介 -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 text-sm text-slate-400 space-y-2">
            <h4 class="font-bold text-slate-200">剧情介绍</h4>
            <p class="leading-relaxed" x-text="vod?.content || '暂无简介'"></p>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>Copyright &copy; 云端影院 All Rights Reserved. 资源来自第三方采集接口，仅供学习交流使用。</p>
    </footer>

    <script>
        function playApp() {
            return {
                vod: null,
                categories: [],
                searchKeyword: '',
                currentPlayUrl: '',
                currentIndex: 0,
                isDrawerOpen: false,
                isLoading: true,
                loadError: '',
                isFullscreen: false,

                async fetchJson(url, label) {
                    const response = await fetch(url, { cache: 'no-cache' });

                    if (!response.ok) {
                        throw new Error(
                            `${label}加载失败（HTTP ${response.status}）：${url}`
                        );
                    }

                    return response.json();
                },

                async init() {
                    const params = new URLSearchParams(window.location.search);
                    const videoId = params.get('id');

                    document.addEventListener('fullscreenchange', () => {
                        this.isFullscreen =
                            document.fullscreenElement ===
                            document.getElementById('player-shell');
                    });

                    document.addEventListener('webkitfullscreenchange', () => {
                        this.isFullscreen =
                            document.webkitFullscreenElement ===
                            document.getElementById('player-shell');
                    });

                    if (!videoId) {
                        this.isLoading = false;
                        this.loadError = '链接中缺少影片 ID。';
                        return;
                    }

                    try {
                        // 分类导航加载失败时，仍继续加载影片。
                        const categoriesPromise = this.fetchJson(
                            './data/categories.json',
                            '分类列表'
                        ).then(data => {
                            this.categories = Array.isArray(data) ? data : [];
                        }).catch(error => {
                            console.warn('分类列表加载失败：', error);
                        });

                        // 兼容当前数据结构：影片 ID -> cat_*.json 分片文件名。
                        const indexData = await this.fetchJson(
                            './data/video_index.json',
                            '视频索引'
                        );

                        const fileName =
                            indexData &&
                            !Array.isArray(indexData) &&
                            typeof indexData === 'object'
                                ? indexData[String(videoId)]
                                : null;

                        if (typeof fileName !== 'string' || !fileName) {
                            throw new Error(
                                '视频索引中没有找到这部影片。请确认链接里的 ID 正确，且 data/video_index.json 已更新。'
                            );
                        }

                        if (!/^[A-Za-z0-9_-]+\.json$/.test(fileName)) {
                            throw new Error('视频索引中的分片文件名无效。');
                        }

                        // 只加载当前影片所在的分片。
                        const videos = await this.fetchJson(
                            './data/' + encodeURIComponent(fileName),
                            '影片数据'
                        );

                        if (!Array.isArray(videos)) {
                            throw new Error(`影片分片格式不正确：${fileName}`);
                        }

                        const video = videos.find(
                            item => item && String(item.id) === String(videoId)
                        );

                        if (!video) {
                            throw new Error(
                                `分片 ${fileName} 中没有找到 ID 为 ${videoId} 的影片。`
                            );
                        }

                        await categoriesPromise;
                        this.setVideo(video);
                    } catch (error) {
                        console.error('影片加载失败：', error);
                        this.loadError =
                            error.message || '影片加载失败，请稍后重试。';
                    } finally {
                        this.isLoading = false;
                    }
                },

                cleanDescription(value) {
                    if (!value) return '';

                    const plainText = String(value)
                        .replace(/<br\s*\/?>/gi, ' ')
                        .replace(/<\/p\s*>/gi, ' ')
                        .replace(/<p\b[^>]*>/gi, ' ')
                        .replace(/<[^>]*>/g, ' ');

                    const decoder = document.createElement('textarea');
                    decoder.innerHTML = plainText;

                    return decoder.value.replace(/\s+/g, ' ').trim();
                },

                setVideo(video) {
                    this.vod = {
                        ...video,
                        episodes: Array.isArray(video.episodes)
                            ? video.episodes
                            : [],
                        content: this.cleanDescription(video.content)
                    };

                    document.getElementById('page-title').textContent =
                        `${video.title || '影片'} 在线观看 - 云端影院`;

                    document.getElementById('page-desc').setAttribute(
                        'content',
                        this.vod.content
                            ? this.vod.content.substring(0, 120)
                            : '云端影院提供免费高清影视在线观看与全集选集。'
                    );

                    if (this.vod.episodes.length > 0) {
                        this.playEpisode(this.vod.episodes[0].url, 0);
                    }
                },

                playEpisode(url, index) {
                    if (typeof url !== 'string' || !url.trim()) return;

                    try {
                        const parsedUrl = new URL(url.trim());

                        if (
                            parsedUrl.protocol !== 'http:' &&
                            parsedUrl.protocol !== 'https:'
                        ) {
                            console.warn('不支持的播放地址协议：', parsedUrl.protocol);
                            return;
                        }

                        this.currentIndex = index;
                        this.currentPlayUrl =
                            `https://jx.xllmcms.com/dplayer/?url=${encodeURIComponent(parsedUrl.href)}`;
                    } catch (error) {
                        console.warn('播放地址格式无效：', url, error);
                    }
                },

                playPrev() {
                    if (this.currentIndex > 0 && this.vod?.episodes?.length) {
                        const index = this.currentIndex - 1;
                        this.playEpisode(this.vod.episodes[index].url, index);
                    }
                },

                playNext() {
                    if (
                        this.vod?.episodes?.length &&
                        this.currentIndex < this.vod.episodes.length - 1
                    ) {
                        const index = this.currentIndex + 1;
                        this.playEpisode(this.vod.episodes[index].url, index);
                    }
                },

                async toggleFullscreen() {
                    const shell = document.getElementById('player-shell');

                    try {
                        const fullscreenElement =
                            document.fullscreenElement ||
                            document.webkitFullscreenElement;

                        if (fullscreenElement === shell) {
                            if (document.exitFullscreen) {
                                await document.exitFullscreen();
                            } else if (document.webkitExitFullscreen) {
                                document.webkitExitFullscreen();
                            }
                            return;
                        }

                        // 让播放器和控制栏作为同一个整体进入全屏。
                        if (shell.requestFullscreen) {
                            await shell.requestFullscreen();
                        } else if (shell.webkitRequestFullscreen) {
                            shell.webkitRequestFullscreen();
                        } else {
                            this.loadError = '当前浏览器不支持网页全屏。';
                        }
                    } catch (error) {
                        console.error('切换全屏失败：', error);
                        this.loadError = '无法进入全屏，请使用浏览器支持的全屏功能。';
                    }
                },

                selectCategory(category) {
                    window.location.href =
                        `index.html?cat=${encodeURIComponent(category.name)}`;
                },

                doSearch() {
                    const keyword = this.searchKeyword.trim();

                    if (keyword) {
                        window.location.href =
                            `index.html?q=${encodeURIComponent(keyword)}`;
                    }
                }
            };
        }
    </script>
