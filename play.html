<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">正在加载 - 云端影院</title>
    <meta id="page-desc" name="description" content="云端影院提供免费高清影视在线观看与全集选集。">
    <link rel="stylesheet" href="./assets/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
    <script defer src="./assets/alpine.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col" x-data="playApp()">

    <!-- 顶部导航 -->
    <header class="bg-gray-900/95 backdrop-blur border-b border-gray-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <a href="index.html" class="text-xl font-bold text-amber-400 tracking-wide shrink-0">🎬 云端影院</a>
            <div class="flex-1 max-w-md flex">
                <input
                    type="text"
                    x-model="searchKeyword"
                    @keyup.enter="doSearch()"
                    placeholder="搜索片名、演员、类型..."
                    class="w-full bg-gray-800 border border-gray-700 rounded-l-lg px-3 py-1.5 text-sm focus:outline-none focus:border-amber-400"
                >
                <button @click="doSearch()" class="bg-amber-500 hover:bg-amber-400 text-gray-950 font-semibold px-4 py-1.5 rounded-r-lg text-sm transition">
                    搜索
                </button>
            </div>
        </div>
        <nav class="max-w-7xl mx-auto px-4 pb-2.5 flex items-center gap-2 overflow-x-auto no-scrollbar">
            <template x-for="cat in categories" :key="cat.name">
                <button
                    @click="selectCategory(cat)"
                    class="px-3 py-1 rounded-full text-xs whitespace-nowrap bg-gray-800 hover:bg-amber-500 hover:text-gray-950 transition"
                    x-text="cat.name"
                ></button>
            </template>
        </nav>
    </header>

    <!-- 主体内容 -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
        <!-- 加载中 -->
        <div x-show="isLoading" class="py-24 text-center text-gray-400">
            <div class="inline-block w-8 h-8 border-4 border-amber-400 border-t-transparent rounded-full animate-spin mb-3"></div>
            <p>正在从云端极速加载视频数据...</p>
        </div>

        <!-- 错误提示 -->
        <div x-show="!isLoading && loadError" class="py-24 text-center">
            <p class="text-red-400 text-lg mb-4" x-text="loadError"></p>
            <a href="index.html" class="inline-block bg-amber-500 hover:bg-amber-400 text-gray-950 font-semibold px-5 py-2 rounded-lg transition">
                返回首页
            </a>
        </div>

        <!-- 播放区域与详情 -->
        <template x-if="!isLoading && !loadError && vod">
            <div>
                <div class="mb-4">
                    <h1 class="text-2xl font-bold text-white" x-text="vod.title"></h1>
                    <div class="text-xs text-gray-400 mt-1.5 flex flex-wrap gap-3">
                        <span x-show="vod.category" class="bg-gray-800 px-2 py-0.5 rounded" x-text="vod.category"></span>
                        <span x-show="vod.year" x-text="'年份：' + vod.year"></span>
                        <span x-show="vod.area" x-text="'地区：' + vod.area"></span>
                        <span x-show="vod.actor" x-text="'主演：' + vod.actor"></span>
                    </div>
                </div>

                <!-- 播放器容器 -->
                <div id="player-container" class="relative w-full aspect-video bg-black rounded-xl overflow-hidden border border-gray-800 shadow-2xl">
                    <video
                        x-show="isDirectStream"
                        id="native-player"
                        controls
                        autoplay
                        playsinline
                        class="w-full h-full bg-black"
                    ></video>
                    <iframe
                        x-show="!isDirectStream"
                        :src="currentPlayUrl"
                        allowfullscreen
                        class="w-full h-full border-0"
                    ></iframe>
                </div>

                <!-- 播控栏 -->
                <div class="mt-3 flex flex-wrap items-center justify-between gap-2 bg-gray-900 border border-gray-800 rounded-xl p-3">
                    <div class="flex items-center gap-2">
                        <button @click="playPrev()" :disabled="currentIndex <= 0" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 disabled:opacity-40 rounded-lg text-xs transition">
                            上一集
                        </button>
                        <button @click="isDrawerOpen = !isDrawerOpen" class="px-3 py-1.5 bg-amber-500 text-gray-950 font-semibold rounded-lg text-xs transition">
                            选集 (<span x-text="(currentIndex + 1) + '/' + (vod.episodes ? vod.episodes.length : 0)"></span>)
                        </button>
                        <button @click="playNext()" :disabled="!vod.episodes || currentIndex >= vod.episodes.length - 1" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 disabled:opacity-40 rounded-lg text-xs transition">
                            下一集
                        </button>
                    </div>
                    <div class="flex items-center gap-2">
                        <button @click="togglePlayMode()" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 rounded-lg text-xs transition" x-text="isDirectStream ? '无法播放？切解析线路' : '切回极速直连'"></button>
                        <button @click="toggleFullscreen()" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 rounded-lg text-xs transition">
                            全屏
                        </button>
                    </div>
                </div>

                <!-- 全部选集 -->
                <section class="mt-6 bg-gray-900 border border-gray-800 rounded-xl p-4" x-show="isDrawerOpen || true">
                    <h2 class="text-base font-semibold mb-3 text-amber-400">全部剧集</h2>
                    <div class="grid grid-cols-3 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-2 max-h-72 overflow-y-auto">
                        <template x-for="(ep, idx) in vod.episodes" :key="idx">
                            <button
                                @click="playEpisode(ep.url, idx)"
                                :class="currentIndex === idx ? 'bg-amber-500 text-gray-950 font-bold' : 'bg-gray-800 hover:bg-gray-700 text-gray-200'"
                                class="px-2 py-2 rounded-lg text-xs truncate transition"
                                x-text="ep.name"
                            ></button>
                        </template>
                    </div>
                </section>

                <!-- 剧情简介 -->
                <section class="mt-6 bg-gray-900 border border-gray-800 rounded-xl p-4">
                    <h2 class="text-base font-semibold mb-2 text-amber-400">剧情简介</h2>
                    <p class="text-sm text-gray-300 leading-relaxed" x-text="vod.content || '暂无简介'"></p>
                </section>
            </div>
        </template>
    </main>

    <script>
        function playApp() {
            return {
                vod: null,
                categories: [],
                searchKeyword: '',
                currentPlayUrl: '',
                selectedEpUrl: '',
                isDirectStream: true,
                hlsInstance: null,
                currentIndex: 0,
                isDrawerOpen: false,
                isLoading: true,
                loadError: '',
                dataVersion: '',

                async initVersion() {
                    try {
                        const res = await fetch(`./data/manifest.json?_t=${Date.now()}`, { cache: 'no-store' });
                        if (res.ok) {
                            const manifest = await res.json();
                            this.dataVersion = manifest.version || '';
                        }
                    } catch (e) {}
                    if (!this.dataVersion) {
                        this.dataVersion = String(Math.floor(Date.now() / 300000));
                    }
                },

                async fetchJson(url) {
                    const sep = url.includes('?') ? '&' : '?';
                    const versionedUrl = `${url}${sep}v=${encodeURIComponent(this.dataVersion)}`;
                    const response = await fetch(versionedUrl, { cache: 'force-cache' });
                    if (!response.ok) throw new Error(`请求失败：${url}`);
                    return response.json();
                },

                async fetchVideoFromFile(file, vodId) {
                    if (!file || !/^[\w.-]+\.json$/.test(file)) return null;
                    try {
                        const videos = await this.fetchJson(`./data/${encodeURIComponent(file)}`);
                        if (!Array.isArray(videos)) return null;
                        return videos.find(v => String(v.id) === String(vodId)) || null;
                    } catch (e) {
                        return null;
                    }
                },

                async init() {
                    const params = new URLSearchParams(window.location.search);
                    const vodId = params.get('id');
                    const targetCategoryName = params.get('cat');
                    const fileParam = params.get('file');

                    if (!vodId) {
                        this.isLoading = false;
                        this.loadError = '未指定有效的视频 ID';
                        return;
                    }

                    try {
                        await this.initVersion();
                        const bucket = String(Math.abs(parseInt(vodId, 10) || 0) % 100).padStart(2, '0');

                        const [categoriesResult, bucketResult] = await Promise.allSettled([
                            this.fetchJson('./data/categories.json'),
                            this.fetchJson(`./data/lookup/${bucket}.json`)
                        ]);

                        if (categoriesResult.status === 'fulfilled' && Array.isArray(categoriesResult.value)) {
                            this.categories = categoriesResult.value;
                        }

                        let foundVod = null;

                        // 1. 先尝试 URL 携带的 file 参数
                        if (fileParam) {
                            foundVod = await this.fetchVideoFromFile(fileParam, vodId);
                        }

                        // 2. 若未命中（例如旧链接分片已漂移），查询分桶索引 data/lookup/XX.json
                        if (!foundVod && bucketResult.status === 'fulfilled' && bucketResult.value) {
                            const mappedFile = bucketResult.value[String(vodId)];
                            if (mappedFile && mappedFile !== fileParam) {
                                foundVod = await this.fetchVideoFromFile(mappedFile, vodId);
                            }
                        }

                        // 3. 兜底：按分类遍历分片查找
                        if (!foundVod) {
                            const fallbackFile = await this.findFileInLegacyData(vodId, targetCategoryName);
                            if (fallbackFile) {
                                foundVod = await this.fetchVideoFromFile(fallbackFile, vodId);
                            }
                        }

                        if (!foundVod) {
                            this.loadError = '没有找到该影片的数据，可能已被更新替换';
                            return;
                        }

                        this.applyVod(foundVod);
                    } catch (error) {
                        console.error('Play init error:', error);
                        this.loadError = '网络加载异常，请稍后重试';
                    } finally {
                        this.isLoading = false;
                    }
                },

                async findFileInLegacyData(vodId, targetCategoryName) {
                    const category = this.categories.find(item => item.name === targetCategoryName);
                    if (!category) return '';
                    const files = category.file ? [category.file] : (Array.isArray(category.files) ? category.files : []);
                    for (const file of files) {
                        const hit = await this.fetchVideoFromFile(file, vodId);
                        if (hit) return file;
                    }
                    return '';
                },

                applyVod(foundVod) {
                    this.vod = foundVod;
                    document.getElementById('page-title').innerText = `${foundVod.title} 免费在线观看 - 云端影院`;
                    if (foundVod.content) {
                        document.getElementById('page-desc').setAttribute('content', foundVod.content.substring(0, 150));
                    }
                    if (Array.isArray(foundVod.episodes) && foundVod.episodes.length > 0) {
                        this.playEpisode(foundVod.episodes[0].url, 0);
                    } else {
                        this.loadError = '该影片暂无可用播放剧集';
                    }
                },

                playEpisode(url, index, forceIframe = false) {
                    this.selectedEpUrl = url;
                    this.currentIndex = index;

                    if (this.hlsInstance) {
                        this.hlsInstance.destroy();
                        this.hlsInstance = null;
                    }

                    const isM3u8 = /\.m3u8(\?|$)/i.test(url);
                    const isMp4 = /\.mp4(\?|$)/i.test(url);

                    if (!forceIframe && (isM3u8 || isMp4)) {
                        this.isDirectStream = true;
                        this.currentPlayUrl = '';
                        this.$nextTick(() => {
                            const video = document.getElementById('native-player');
                            if (!video) return;
                            if (isM3u8 && window.Hls && Hls.isSupported()) {
                                this.hlsInstance = new Hls({ maxBufferLength: 30 });
                                this.hlsInstance.loadSource(url);
                                this.hlsInstance.attachMedia(video);
                                this.hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                                    if (data.fatal) {
                                        // 直连播放异常时自动回退解析线路
                                        this.playEpisode(url, index, true);
                                    }
                                });
                            } else {
                                video.src = url;
                            }
                        });
                    } else {
                        this.isDirectStream = false;
                        this.currentPlayUrl = `https://jx.xllmcms.com/dplayer/?url=${encodeURIComponent(url)}`;
                    }
                },

                togglePlayMode() {
                    if (!this.selectedEpUrl) return;
                    this.playEpisode(this.selectedEpUrl, this.currentIndex, this.isDirectStream);
                },

                playPrev() {
                    if (this.vod?.episodes && this.currentIndex > 0) {
                        const index = this.currentIndex - 1;
                        this.playEpisode(this.vod.episodes[index].url, index);
                    }
                },

                playNext() {
                    if (this.vod?.episodes && this.currentIndex < this.vod.episodes.length - 1) {
                        const index = this.currentIndex + 1;
                        this.playEpisode(this.vod.episodes[index].url, index);
                    }
                },

                toggleFullscreen() {
                    const container = document.getElementById('player-container');
                    if (!document.fullscreenElement) {
                        (container.requestFullscreen || container.webkitRequestFullscreen)?.call(container);
                    } else {
                        (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
                    }
                },

                selectCategory(category) {
                    window.location.href = `index.html?cat=${encodeURIComponent(category.name)}`;
                },

                doSearch() {
                    const keyword = this.searchKeyword.trim();
                    if (keyword) window.location.href = `index.html?q=${encodeURIComponent(keyword)}`;
                }
            };
        }
    </script>

</body>
</html>
