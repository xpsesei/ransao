name: Full Sync & Release

on:
  schedule:
    - cron: '10 16 * * *' # 北京时间每天凌晨 00:10 自动更新
  workflow_dispatch: # 支持手动触发

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予写入权限
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Full Sync Script
        run: python update_data.py

      - name: Upload Data to GitHub Release via GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. 如果 Release 不存在则自动创建
          gh release create data-release --title "全量影视数据库 (自动更新)" --notes "由 GitHub Actions 自动全量采集的影视数据" || true

          # 2. 上传 categories.json 和所有哈希分类文件（使用 --clobber 自动覆盖旧文件）
          gh release upload data-release data/categories.json data/cat_*.json --clobber
