name: Full Sync & Release

on:
  schedule:
    - cron: '10 16 * * *' # 北京时间每天凌晨 00:10 自动更新
  workflow_dispatch: # 支持手动触发

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予写入权限
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Full Sync Script
        run: python update_data.py

      - name: Bulletproof Release Re-creation via GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 配置 Git 身份，确保能正常清理远程标签
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # 1. 彻底清理旧的 Release、本地标签和远程标签（防止标签冲突导致出口代码 1）
          gh release delete data-release --yes --cleanup-tag || true
          git tag -d data-release || true
          git push origin --delete data-release || true

          # 2. 创建全新的 Release 并打包上传 data 目录下的所有 json 文件
          gh release create data-release data/*.json --title "全量影视数据库 (自动更新)" --notes "由 GitHub Actions 自动全量采集的影视数据，供前端静态网页实时调用。"
