name: Auto Update Video Data

on:
  schedule:
    # 每天 UTC 16:10 运行，即北京时间次日 00:10
    - cron: "10 16 * * *"
  workflow_dispatch:

# 防止定时任务和手动任务同时改写数据目录。
concurrency:
  group: video-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run data update
        env:
          SITE_URL: https://198616.xyz
        run: python update_data.py

      - name: Commit and push generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/ sitemap.xml sitemap-*.xml

          if git diff --cached --quiet; then
            echo "没有数据变更，无需提交。"
            exit 0
          fi

          git commit -m "Update video data and sitemaps"
          git push origin HEAD:main
