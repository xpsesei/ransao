name: Auto Update VOD Data & Build CSS

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'play.html'
      - 'update_data.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      - name: Build static Tailwind CSS
        run: |
          mkdir -p assets
          npx @tailwindcss/cli --content "./index.html,./play.html" -o ./assets/style.css --minify

      - name: Run update_data.py
        run: python update_data.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ sitemaps/ sitemap.xml assets/style.css
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto update vod data & build css"
            git push
          else
            echo "No changes to commit."
          fi
