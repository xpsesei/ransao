name: Full Sync & Release

on:
  schedule:
    - cron: '10 16 * * *' # 北京时间每天凌晨 00:10 自动更新
  workflow_dispatch: # 支持手动触发

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予写入权限
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Full Sync Script
        run: python update_data.py

      - name: Create or Update Release via GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. 尝试创建 Release（如果标签和 Release 已经存在，则忽略错误继续往下走）
          gh release create data-release --title "全量影视数据库 (自动更新)" --notes "由 GitHub Actions 自动全量采集的影视数据，供前端静态网页实时调用。" || true

          # 2. 直接上传 data 目录下的所有 json 文件，并使用 --clobber 自动覆盖旧文件
          gh release upload data-release data/*.json --clobber
