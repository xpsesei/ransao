name: Full Sync & Release

on:
  schedule:
    - cron: '10 16 * * *' # 北京时间每天凌晨 00:10 自动更新
  workflow_dispatch: # 支持手动触发

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予写入权限
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Full Sync Script
        run: python update_data.py

      - name: Debug and Upload Release via GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x # 开启调试模式，打印执行过程，精准定位报错行
          
          # 1. 检查 data 目录下的文件是否真的生成了
          ls -la data/
          
          # 2. 检查 gh 命令是否可用及登录状态
          gh auth status
          
          # 3. 检查 Release 是否存在，不存在则创建
          gh release view data-release || gh release create data-release --title "全量影视数据库 (自动更新)" --notes "由 GitHub Actions 自动全量采集的影视数据"
          
          # 4. 上传文件
          gh release upload data-release data/*.json --clobber
