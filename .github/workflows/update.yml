Name: Full Sync & Commit

on:
  schedule:
    - cron: '10 16 * * *'
  workflow_dispatch:

jobs:
  sync-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Full Sync Script
        run: python update_data.py

      - name: Commit and Push JSON data to Repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 🚀 关键修复 1：推送前先拉取变基，彻底解决“推送被拒绝 / 远程包含本地没有的作业”报错
          git pull origin main --rebase || true
          
          # 🚀 关键修复 2：同时添加轻量化分片数据目录和 SEO 网站地图
          git add data/ sitemap.xml
          
          git commit -m "Auto-update video data and sitemap [skip ci]" || echo "No changes to commit"
          git push
