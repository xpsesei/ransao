name: Auto Update Video Data

on:
  schedule:
    - cron: '10 16 * * *' # 每天 UTC 16:10 触发（即北京时间每天 00:10）
  workflow_dispatch:

jobs:
  sync-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Incremental Sync Script
        run: python update_data.py

      - name: Commit and Push JSON data to Repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 🚀 推送前先拉取变基，彻底解决推送冲突
          git pull origin main --rebase || true
          
          # 🚀 添加轻量化分片数据目录和 SEO 网站地图
          git add data/ sitemap.xml
          
          git commit -m "Auto-update incremental video data and sitemap [skip ci]" || echo "No changes to commit"
          git push
